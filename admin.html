<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jordan Store | Vault Control Console</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-base: #080A0D;
            --surface-card: #10141C;
            --surface-field: #121722;
            --gold-primary: #D6AD5C;
            --gold-highlight: #F0C96A;
            --gold-border: rgba(214, 173, 92, 0.25);
            --gold-glow: rgba(214, 173, 92, 0.2);
            --text-main: #F5F3EE;
            --text-muted: #A5A8B0;
            --border-subtle: rgba(255, 255, 255, 0.06);
            --danger: #ef4444;
            --font-display: 'Cinzel', serif;
            --font-body: 'Inter', sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: var(--font-body);
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 40px 20px;
            background-image: 
                radial-gradient(circle at 15% 15%, rgba(214, 173, 92, 0.05) 0%, transparent 45%),
                radial-gradient(circle at 85% 85%, rgba(168, 85, 247, 0.03) 0%, transparent 45%);
        }

        .panel-container {
            width: 100%;
            max-width: 560px;
            background: var(--surface-card);
            border: 1px solid var(--gold-border);
            border-radius: 6px;
            padding: 36px 32px;
            box-shadow: 0 24px 60px rgba(0, 0, 0, 0.75), 0 0 30px rgba(214, 173, 92, 0.08);
        }

        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 28px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border-subtle);
        }

        h2 {
            font-family: var(--font-display);
            font-size: 1.15rem;
            font-weight: 700;
            letter-spacing: 0.12em;
            text-transform: uppercase;
        }

        h2 span {
            color: var(--gold-primary);
        }

        .quick-nav {
            display: flex;
            gap: 8px;
        }

        .quick-icon-btn {
            background: var(--surface-field);
            border: 1px solid var(--border-subtle);
            color: var(--text-muted);
            width: 36px;
            height: 36px;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            transition: all 0.25s ease;
        }

        .quick-icon-btn svg {
            width: 16px;
            height: 16px;
            fill: currentColor;
        }

        .quick-icon-btn:hover {
            color: var(--gold-highlight);
            border-color: var(--gold-primary);
            box-shadow: 0 0 12px var(--gold-glow);
        }

        .auth-view, .dashboard-view { display: none; }
        .active { display: block; }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .form-group { margin-bottom: 20px; }

        .form-group label {
            display: block;
            font-size: 0.72rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.12em;
            margin-bottom: 8px;
            color: var(--gold-primary);
        }

        .form-group input, .form-group textarea, .form-group select {
            width: 100%;
            background: var(--surface-field);
            border: 1px solid var(--border-subtle);
            padding: 12px 14px;
            border-radius: 4px;
            color: var(--text-main);
            font-size: 0.9rem;
            transition: all 0.25s ease;
        }

        .form-group input:focus, .form-group textarea:focus, .form-group select:focus {
            outline: none;
            border-color: var(--gold-primary);
            box-shadow: 0 0 12px var(--gold-glow);
        }

        .form-group select option {
            background: var(--surface-card);
            color: var(--text-main);
        }

        .file-upload-wrapper {
            border: 1px dashed var(--gold-border);
            background: var(--surface-field);
            padding: 20px;
            border-radius: 4px;
            text-align: center;
            position: relative;
            cursor: pointer;
            transition: all 0.25s ease;
        }

        .file-upload-wrapper:hover {
            border-color: var(--gold-highlight);
            background: rgba(214, 173, 92, 0.04);
        }

        .file-upload-wrapper input[type="file"] {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            opacity: 0; cursor: pointer;
        }

        .file-status-text {
            font-size: 0.8rem;
            font-weight: 500;
            color: var(--text-muted);
            letter-spacing: 0.02em;
        }

        .preview-img {
            width: 100%;
            max-height: 160px;
            object-fit: contain;
            border-radius: 4px;
            margin-top: 12px;
            display: none;
            background: #0b0e14;
            border: 1px solid var(--border-subtle);
            padding: 8px;
        }

        .action-btn {
            width: 100%;
            background: var(--gold-primary);
            color: var(--bg-base);
            border: none;
            padding: 14px;
            font-size: 0.8rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.14em;
            border-radius: 2px;
            cursor: pointer;
            transition: all 0.25s ease;
            display: block;
            text-align: center;
            margin-top: 8px;
        }

        .action-btn:hover {
            background: var(--gold-highlight);
            transform: translateY(-1px);
            box-shadow: 0 8px 20px rgba(214, 173, 92, 0.25);
        }

        .action-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .logout-btn {
            background: transparent;
            color: var(--danger);
            border: 1px solid rgba(239, 68, 68, 0.3);
            margin-top: 24px;
        }

        .logout-btn:hover {
            background: rgba(239, 68, 68, 0.1);
            box-shadow: none;
            transform: none;
        }

        .item-list {
            margin-top: 36px;
            border-top: 1px solid var(--border-subtle);
            padding-top: 24px;
        }

        .item-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--surface-field);
            padding: 12px 14px;
            border-radius: 4px;
            border: 1px solid var(--border-subtle);
            margin-bottom: 10px;
            gap: 12px;
            transition: border-color 0.2s ease;
        }

        .item-row:hover {
            border-color: var(--gold-border);
        }

        .item-info {
            display: flex;
            align-items: center;
            gap: 12px;
            overflow: hidden;
        }

        .item-thumb {
            width: 38px;
            height: 38px;
            border-radius: 4px;
            object-fit: contain;
            background: #0b0e14;
            border: 1px solid var(--border-subtle);
            flex-shrink: 0;
            padding: 2px;
        }

        .item-title-wrap {
            overflow: hidden;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .item-title {
            font-size: 0.85rem;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: var(--text-main);
        }

        .item-category-tag {
            font-size: 0.65rem;
            color: var(--gold-primary);
            letter-spacing: 0.06em;
            text-transform: uppercase;
        }

        .del-btn {
            background: rgba(239, 68, 68, 0.1);
            color: var(--danger);
            border: 1px solid rgba(239, 68, 68, 0.25);
            padding: 6px 12px;
            border-radius: 2px;
            font-size: 0.7rem;
            letter-spacing: 0.05em;
            cursor: pointer;
            font-weight: 600;
            flex-shrink: 0;
            transition: all 0.2s;
        }

        .del-btn:hover {
            background: var(--danger);
            color: #fff;
        }

        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--surface-card);
            border: 1px solid var(--gold-border);
            color: var(--text-main);
            padding: 12px 24px;
            border-radius: 4px;
            font-size: 0.8rem;
            font-weight: 600;
            letter-spacing: 0.05em;
            box-shadow: 0 16px 36px rgba(0, 0, 0, 0.8);
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
            z-index: 1000;
        }

        .toast.visible { opacity: 1; }

        @media (max-width: 600px) {
            .form-row {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <div class="panel-container">
        <!-- Auth Gate -->
        <div class="auth-view active" id="authView">
            <div class="header-bar">
                <h2>Terminal <span>Access</span></h2>
                <div class="quick-nav">
                    <a href="index.html" class="quick-icon-btn" title="Live Store">
                        <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
                    </a>
                </div>
            </div>
            <form id="loginForm" onsubmit="handleAdminLogin(event)">
                <div class="form-group">
                    <label>Admin Email</label>
                    <input type="email" id="adminEmail" placeholder="admin@jordanstore.com" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="adminPass" placeholder="Enter password" required>
                </div>
                <button type="submit" id="loginBtn" class="action-btn">Unlock Console</button>
            </form>
        </div>

        <!-- Dashboard -->
        <div class="dashboard-view" id="dashboardView">
            <div class="header-bar">
                <h2>Vault <span>Inventory Control</span></h2>
                <div class="quick-nav">
                    <a href="index.html" class="quick-icon-btn" title="View Store">
                        <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
                    </a>
                    <a href="mailto:rj7010323@gmail.com" class="quick-icon-btn" title="Concierge Inquiries">
                        <svg viewBox="0 0 24 24"><path d="M20 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg>
                    </a>
                </div>
            </div>
            
            <form id="productForm" onsubmit="publishAffiliateProduct(event)">
                <div class="form-group">
                    <label>Product Name</label>
                    <input type="text" id="prodTitle" placeholder="e.g. Air Jordan 1 High 'Chicago' 1985" required>
                </div>
                
                <div class="form-row">
                    <!-- Department Category -->
                    <div class="form-group">
                        <label>Department Category</label>
                        <select id="prodCategory" required>
                            <option value="Home & Decor">Home & Decor</option>
                            <option value="Kids & Gifts">Kids & Gifts</option>
                            <option value="Gadgets">Gadgets</option>
                            <option value="Lifestyle">Lifestyle</option>
                            <option value="Retro">Retro Collection</option>
                            <option value="Limited">Limited Editions</option>
                        </select>
                    </div>

                    <!-- Collection / Edition Tier -->
                    <div class="form-group">
                        <label>Collection Edition / Tier</label>
                        <select id="prodEdition" required>
                            <option value="Retro">Retro Collection</option>
                            <option value="Limited">Limited Edition</option>
                            <option value="Luxury">Luxury Vault</option>
                            <option value="Deadstock">Deadstock Archive</option>
                            <option value="Standard">Standard Release</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label>Price (₹ INR Numeric Only)</label>
                    <input type="number" id="prodPrice" placeholder="e.g. 1850" step="0.01" required>
                </div>

                <div class="form-group">
                    <label>Upload Image File</label>
                    <div class="file-upload-wrapper">
                        <input type="file" id="prodFile" accept="image/*" onchange="handleLocalImageUpload(event)">
                        <div class="file-status-text" id="fileStatus">Click or drag image file here</div>
                    </div>
                    <img id="imagePreview" class="preview-img" alt="Upload Preview">
                </div>

                <div class="form-group">
                    <label>Or Web Image URL</label>
                    <input type="url" id="prodImg" placeholder="https://...">
                </div>

                <div class="form-group">
                    <label>Purchase / Affiliate Hop Link</label>
                    <input type="url" id="prodLink" placeholder="https://..." required>
                </div>

                <div class="form-group">
                    <label>Archival Provenance & Details</label>
                    <textarea id="prodDesc" rows="3" placeholder="Add piece provenance, condition details, and archive history..."></textarea>
                </div>

                <button type="submit" id="submitBtn" class="action-btn">Publish to Archive</button>
            </form>
            
            <div class="item-list">
                <label style="display:block; font-size:0.72rem; text-transform:uppercase; letter-spacing:0.12em; margin-bottom:14px; color:var(--gold-primary); font-weight:700;">Live Vault Archive Inventory</label>
                <div id="activeContainer"></div>
            </div>

            <button class="action-btn logout-btn" onclick="handleAdminLogout()">Lock Console</button>
        </div>
    </div>

    <div class="toast" id="alertToast">Action processed successfully.</div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, addDoc, deleteDoc, doc, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDggq2H6VpwteslozxGeYEy4ocyS8d_tAo",
            authDomain: "jordan-store-1.firebaseapp.com",
            projectId: "jordan-store-1",
            storageBucket: "jordan-store-1.firebasestorage.app",
            messagingSenderId: "830846757501",
            appId: "1:830846757501:web:7fd37fcb86ef9e30d31f14",
            measurementId: "G-5NK1N5GX8J"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const productsCollection = collection(db, "products");

        let uploadedBase64Image = "";
        let unsubscribeSnapshot = null;

        onAuthStateChanged(auth, (user) => {
            if (user) {
                document.getElementById('authView').classList.remove('active');
                document.getElementById('dashboardView').classList.add('active');
                listenToCloudProducts();
            } else {
                document.getElementById('authView').classList.add('active');
                document.getElementById('dashboardView').classList.remove('active');
                if (unsubscribeSnapshot) unsubscribeSnapshot();
            }
        });

        window.handleAdminLogin = async function(e) {
            e.preventDefault();
            const email = document.getElementById('adminEmail').value.trim();
            const pass = document.getElementById('adminPass').value;
            const btn = document.getElementById('loginBtn');

            btn.disabled = true;
            btn.innerText = "Authenticating...";

            try {
                await signInWithEmailAndPassword(auth, email, pass);
                document.getElementById('loginForm').reset();
                popAlertToast("Clearance granted.");
            } catch (err) {
                popAlertToast("Access Denied: " + err.message);
            } finally {
                btn.disabled = false;
                btn.innerText = "Unlock Console";
            }
        };

        window.handleAdminLogout = async function() {
            await signOut(auth);
            popAlertToast("Console locked.");
        };

        window.handleLocalImageUpload = function(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                uploadedBase64Image = e.target.result;
                const preview = document.getElementById('imagePreview');
                preview.src = uploadedBase64Image;
                preview.style.display = 'block';
                document.getElementById('fileStatus').innerText = `Selected: ${file.name}`;
            };
            reader.readAsDataURL(file);
        };

        window.publishAffiliateProduct = async function(e) {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            btn.disabled = true;
            btn.innerText = "Syncing...";

            const finalImage = uploadedBase64Image || document.getElementById('prodImg').value.trim();
            const rawPrice = parseFloat(document.getElementById('prodPrice').value);

            const entry = {
                title: document.getElementById('prodTitle').value.replace(/</g, "&lt;"),
                category: document.getElementById('prodCategory').value,
                edition: document.getElementById('prodEdition').value,
                price: isNaN(rawPrice) ? 0 : rawPrice,
                img: finalImage,
                link: document.getElementById('prodLink').value,
                desc: document.getElementById('prodDesc').value.replace(/</g, "&lt;"),
                createdAt: Date.now()
            };

            try {
                await addDoc(productsCollection, entry);
                document.getElementById('productForm').reset();
                uploadedBase64Image = "";
                document.getElementById('imagePreview').style.display = 'none';
                document.getElementById('fileStatus').innerText = "Click or drag image file here";
                popAlertToast("Synced to Vault Archive.");
            } catch (err) {
                popAlertToast("Error uploading: " + err.message);
            } finally {
                btn.disabled = false;
                btn.innerText = "Publish to Archive";
            }
        };

        window.removeCloudProduct = async function(docId) {
            try {
                await deleteDoc(doc(db, "products", docId));
                popAlertToast("Product removed from Archive.");
            } catch (err) {
                popAlertToast("Failed to delete: " + err.message);
            }
        };

        function listenToCloudProducts() {
            const q = query(productsCollection, orderBy("createdAt", "desc"));
            unsubscribeSnapshot = onSnapshot(q, (snapshot) => {
                const listArea = document.getElementById('activeContainer');
                listArea.innerHTML = '';
                if(snapshot.empty) {
                    listArea.innerHTML = `<div style="font-size:0.8rem; color:var(--text-muted); text-align:center; padding:16px 0;">No active vault products.</div>`;
                    return;
                }
                snapshot.forEach((docSnap) => {
                    const item = docSnap.data();
                    const docId = docSnap.id;
                    const row = document.createElement('div');
                    row.className = 'item-row';
                    row.innerHTML = `
                        <div class="item-info">
                            ${item.img ? `<img src="${item.img}" class="item-thumb" alt="Thumb">` : ''}
                            <div class="item-title-wrap">
                                <span class="item-title">${item.title} (₹${Number(item.price).toLocaleString('en-IN')})</span>
                                <span class="item-category-tag">${item.edition || item.category || 'Archive'} • ${item.category || 'General'}</span>
                            </div>
                        </div>
                        <button class="del-btn" onclick="removeCloudProduct('${docId}')">Delete</button>
                    `;
                    listArea.appendChild(row);
                });
            });
        }

        function popAlertToast(msg) {
            const toast = document.getElementById('alertToast');
            toast.innerText = msg;
            toast.classList.add('visible');
            setTimeout(() => toast.classList.remove('visible'), 2500);
        }
    </script>
</body>
</html>
