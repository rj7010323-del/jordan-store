<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>THE ARCHIVE | Luxury & Lifestyle Showcase</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-obsidian: #08080c;
            --surface-panel: #101017;
            --surface-card: #15151f;
            --surface-accent: #1c1c2b;
            --gold-primary: #e5b869;
            --gold-glow: rgba(229, 184, 105, 0.35);
            --jordan-red: #ff2a4b;
            --jordan-glow: rgba(255, 42, 75, 0.4);
            --text-pure: #ffffff;
            --text-sub: #9499ad;
            --border-glass: rgba(255, 255, 255, 0.08);
            --border-hover: rgba(229, 184, 105, 0.5);
            --radius-md: 14px;
            --radius-lg: 20px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-obsidian);
            color: var(--text-pure);
            min-height: 100vh;
            overflow-x: hidden;
            background-image: 
                radial-gradient(circle at 15% 10%, rgba(255, 42, 75, 0.07) 0%, transparent 40%),
                radial-gradient(circle at 85% 90%, rgba(229, 184, 105, 0.06) 0%, transparent 45%),
                linear-gradient(180deg, rgba(8, 8, 12, 0.9) 0%, #08080c 100%);
            background-attachment: fixed;
            padding-top: 80px;
            perspective: 1200px;
        }

        .container {
            max-width: 1280px;
            margin: 0 auto;
            padding: 0 20px;
        }

        /* Glass Header */
        header {
            background: rgba(10, 10, 16, 0.85);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-bottom: 1px solid var(--border-glass);
            position: fixed;
            width: 100%;
            top: 0;
            left: 0;
            z-index: 100;
        }

        .nav-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 0;
        }

        .logo {
            font-size: 20px;
            font-weight: 900;
            letter-spacing: 1.5px;
            text-decoration: none;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .shuffle-word {
            color: var(--gold-primary);
            text-shadow: 0 0 16px var(--gold-glow);
            display: inline-block;
            transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.35s;
        }

        .shuffle-word.flip-out {
            transform: translateY(-10px) rotateX(75deg);
            opacity: 0;
        }

        .shuffle-word.flip-in {
            transform: translateY(10px) rotateX(-75deg);
            opacity: 0;
        }

        .nav-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .icon-btn, .pill-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: var(--surface-panel);
            border: 1px solid var(--border-glass);
            color: var(--text-pure);
            text-decoration: none;
            transition: all 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        .icon-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
        }

        .icon-btn svg, .pill-btn svg {
            width: 16px;
            height: 16px;
            fill: currentColor;
        }

        .pill-btn {
            gap: 8px;
            padding: 9px 18px;
            border-radius: 30px;
            font-size: 13px;
            font-weight: 700;
        }

        .icon-btn:hover, .pill-btn:hover {
            border-color: var(--gold-primary);
            background: rgba(229, 184, 105, 0.12);
            color: var(--gold-primary);
            box-shadow: 0 4px 18px var(--gold-glow);
            transform: translateY(-2px);
        }

        /* Hero Banner */
        .top-hero-banner {
            position: relative;
            padding: 40px 0 20px;
            text-align: center;
            overflow: hidden;
        }

        .punchline-bg {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: clamp(32px, 7vw, 84px);
            font-weight: 900;
            letter-spacing: 6px;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.025);
            white-space: nowrap;
            pointer-events: none;
            z-index: 1;
        }

        .top-hero-tag {
            position: relative;
            z-index: 2;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(229, 184, 105, 0.08);
            border: 1px solid rgba(229, 184, 105, 0.35);
            color: var(--gold-primary);
            font-size: 11px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 2px;
            padding: 9px 24px;
            border-radius: 30px;
            box-shadow: 0 0 25px rgba(229, 184, 105, 0.15);
            backdrop-filter: blur(8px);
        }

        /* 3D Carousel Section */
        .featured-slider-section {
            margin: 20px auto 35px;
        }

        .slider-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
        }

        .slider-title {
            font-size: 13px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--gold-primary);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .slider-title::before {
            content: '';
            width: 8px;
            height: 8px;
            background: var(--jordan-red);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--jordan-red);
        }

        .slider-controls {
            display: flex;
            gap: 8px;
        }

        .slider-arrow {
            background: var(--surface-panel);
            border: 1px solid var(--border-glass);
            color: var(--text-pure);
            width: 34px;
            height: 34px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .slider-arrow:hover {
            border-color: var(--gold-primary);
            background: var(--gold-primary);
            color: #000;
            box-shadow: 0 0 14px var(--gold-glow);
        }

        .slider-container {
            display: flex;
            gap: 16px;
            overflow-x: auto;
            scroll-behavior: smooth;
            padding: 8px 4px 16px;
            scrollbar-width: none;
            -webkit-overflow-scrolling: touch;
        }

        .slider-container::-webkit-scrollbar {
            display: none;
        }

        .slide-item {
            flex: 0 0 220px;
            background: var(--surface-card);
            border: 1px solid var(--border-glass);
            border-radius: var(--radius-md);
            overflow: hidden;
            cursor: pointer;
            position: relative;
            transition: transform 0.4s cubic-bezier(0.165, 0.84, 0.44, 1), box-shadow 0.4s ease;
            transform-style: preserve-3d;
        }

        .slide-item:hover {
            transform: translateY(-6px) rotateX(4deg);
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.6), 0 0 15px var(--gold-glow);
            border-color: var(--border-hover);
        }

        .slide-img-box {
            width: 100%;
            height: 150px;
            background: radial-gradient(circle at center, var(--surface-accent) 0%, var(--surface-panel) 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 12px;
        }

        .slide-img-box img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            filter: drop-shadow(0 8px 12px rgba(0, 0, 0, 0.6));
            transition: transform 0.3s ease;
        }

        .slide-item:hover .slide-img-box img {
            transform: scale(1.08) translateY(-2px);
        }

        .slide-info {
            padding: 12px 14px;
            background: var(--surface-card);
        }

        .slide-title {
            font-size: 13px;
            font-weight: 700;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: #fff;
            margin-bottom: 4px;
        }

        .slide-price {
            font-size: 14px;
            font-weight: 800;
            color: var(--gold-primary);
        }

        /* Filter Controls */
        .controls-bar {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 14px;
            align-items: center;
            background: var(--surface-panel);
            padding: 16px 20px;
            border-radius: var(--radius-md);
            border: 1px solid var(--border-glass);
            margin-bottom: 30px;
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.4);
        }

        .control-item {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .control-item label {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-sub);
            font-weight: 800;
        }

        .select-filter, .search-input {
            background: var(--surface-accent);
            border: 1px solid var(--border-glass);
            color: #fff;
            padding: 11px 16px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            outline: none;
            transition: all 0.25s ease;
            width: 100%;
        }

        .select-filter:focus, .search-input:focus {
            border-color: var(--gold-primary);
            box-shadow: 0 0 12px var(--gold-glow);
        }

        /* Main 3D Product Grid */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 24px;
            margin-bottom: 50px;
            perspective: 1000px;
        }

        .card {
            background: var(--surface-card);
            border: 1px solid var(--border-glass);
            border-radius: var(--radius-lg);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            cursor: pointer;
            position: relative;
            transition: transform 0.45s cubic-bezier(0.2, 0.8, 0.2, 1), box-shadow 0.45s ease, border-color 0.45s ease;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.35);
            transform-style: preserve-3d;
        }

        .card:hover {
            transform: translateY(-8px) rotateX(3deg) rotateY(-2deg);
            border-color: var(--border-hover);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.7), 0 0 25px var(--gold-glow);
        }

        .card-badge {
            position: absolute;
            top: 12px;
            left: 12px;
            background: rgba(10, 10, 16, 0.85);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border-glass);
            font-size: 10px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            padding: 5px 12px;
            border-radius: 8px;
            z-index: 2;
            color: var(--gold-primary);
        }

        .img-wrapper {
            width: 100%;
            height: 240px;
            background: radial-gradient(circle at center, #1b1b28 0%, #101017 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            position: relative;
            overflow: hidden;
        }

        .img-wrapper img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            filter: drop-shadow(0 12px 18px rgba(0, 0, 0, 0.65));
            transition: transform 0.45s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        .card:hover .img-wrapper img {
            transform: scale(1.08) translateY(-4px);
        }

        .img-placeholder {
            color: var(--text-sub);
            font-size: 24px;
            font-weight: 900;
            opacity: 0.2;
            letter-spacing: 2px;
        }

        .info {
            padding: 18px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
            background: var(--surface-card);
        }

        .info h3 {
            font-size: 15px;
            font-weight: 800;
            margin-bottom: 6px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: #fff;
        }

        .info .price {
            color: var(--gold-primary);
            font-weight: 900;
            font-size: 18px;
            margin-bottom: 12px;
        }

        .info .click-hint {
            font-size: 11px;
            font-weight: 700;
            color: var(--text-sub);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        /* Details Modal / Drawer */
        .sidebar-backdrop {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(4, 4, 6, 0.8);
            backdrop-filter: blur(14px);
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.35s ease;
        }

        .sidebar-backdrop.open {
            opacity: 1;
            pointer-events: auto;
        }

        .product-sidebar {
            position: fixed;
            top: 0;
            right: -560px;
            width: 100%;
            max-width: 520px;
            height: 100vh;
            background: var(--surface-panel);
            border-left: 1px solid var(--border-glass);
            z-index: 1001;
            display: flex;
            flex-direction: column;
            box-shadow: -20px 0 60px rgba(0, 0, 0, 0.9);
            transition: right 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            overflow-y: auto;
        }

        .sidebar-backdrop.open .product-sidebar {
            right: 0;
        }

        .mobile-drag-handle {
            display: none;
            width: 44px;
            height: 5px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 4px;
            margin: 12px auto 6px;
        }

        .sidebar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px 24px;
            border-bottom: 1px solid var(--border-glass);
            position: sticky;
            top: 0;
            background: rgba(16, 16, 23, 0.95);
            backdrop-filter: blur(12px);
            z-index: 10;
        }

        .sidebar-header span {
            font-size: 11px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--gold-primary);
        }

        .close-sidebar-btn {
            background: var(--surface-accent);
            border: 1px solid var(--border-glass);
            color: #fff;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }

        .close-sidebar-btn:hover {
            background: var(--jordan-red);
            border-color: var(--jordan-red);
            transform: rotate(90deg);
        }

        .sidebar-img-wrapper {
            width: 100%;
            height: 320px;
            background: radial-gradient(circle at center, #1f1f2e 0%, #101017 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            border-bottom: 1px solid var(--border-glass);
        }

        .sidebar-img-wrapper img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            filter: drop-shadow(0 15px 25px rgba(0, 0, 0, 0.75));
        }

        .sidebar-body {
            padding: 26px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .sidebar-category {
            font-size: 11px;
            font-weight: 800;
            color: var(--gold-primary);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 6px;
        }

        .sidebar-title {
            font-size: 22px;
            font-weight: 900;
            margin-bottom: 10px;
            line-height: 1.3;
            color: #fff;
        }

        .sidebar-price {
            font-size: 24px;
            font-weight: 900;
            color: var(--gold-primary);
            margin-bottom: 18px;
        }

        .sidebar-desc {
            color: var(--text-sub);
            font-size: 14px;
            line-height: 1.7;
            margin-bottom: 28px;
        }

        .sidebar-buy-btn {
            background: linear-gradient(135deg, var(--gold-primary), #cb9a46);
            color: #000;
            text-decoration: none;
            padding: 16px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            border-radius: 12px;
            text-align: center;
            display: block;
            box-shadow: 0 10px 30px var(--gold-glow);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            margin-top: auto;
        }

        .sidebar-buy-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 14px 35px var(--gold-glow);
        }

        .sidebar-buy-btn:active {
            transform: scale(0.98);
        }

        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 70px 20px;
            background: var(--surface-panel);
            border: 2px dashed var(--border-glass);
            border-radius: var(--radius-lg);
            color: var(--text-sub);
        }

        /* Footer */
        footer {
            border-top: 1px solid var(--border-glass);
            padding: 40px 0;
            background: var(--surface-panel);
            text-align: center;
            margin-top: 60px;
        }

        .rights-statement {
            color: var(--text-sub);
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 16px;
        }

        .footer-links {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 12px;
        }

        /* Mobile Optimization */
        @media (max-width: 768px) {
            body {
                padding-top: 70px;
            }

            .grid {
                grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
                gap: 14px;
            }

            .img-wrapper {
                height: 180px;
                padding: 10px;
            }

            .info {
                padding: 12px;
            }

            .info h3 {
                font-size: 13px;
            }

            .info .price {
                font-size: 15px;
            }

            .product-sidebar {
                top: auto;
                bottom: -100%;
                right: 0;
                max-width: 100%;
                height: 85vh;
                border-left: none;
                border-top: 1px solid var(--border-glass);
                border-radius: 24px 24px 0 0;
                transition: bottom 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            }

            .sidebar-backdrop.open .product-sidebar {
                bottom: 0;
                right: 0;
            }

            .mobile-drag-handle {
                display: block;
            }

            .sidebar-img-wrapper {
                height: 240px;
            }
        }
    </style>
</head>

    <!-- Top Hero -->
    <section class="top-hero-banner container">
        <div class="punchline-bg">CURATED LUXURY • TIMELESS LEGACY</div>
        <div class="top-hero-tag">Verified Global Archive</div>
    </section>

    <!-- Top 5 Latest Uploads Slider -->
    <section class="featured-slider-section container" id="featuredSliderSection" style="display: none;">
        <div class="slider-header">
            <div class="slider-title">Latest Vault Arrivals</div>
            <div class="slider-controls">
                <button class="slider-arrow" onclick="scrollSlider(-240)">&#10094;</button>
                <button class="slider-arrow" onclick="scrollSlider(240)">&#10095;</button>
            </div>
        </div>
        <div class="slider-container" id="featuredSlider"></div>
    </section>

    <!-- Showroom Controls -->
    <main class="container">
        <div class="controls-bar">
            <div class="control-item">
                <label for="searchInput">Search Vault</label>
                <input type="text" id="searchInput" class="search-input" placeholder="Search by name..." oninput="renderShowroomView()">
            </div>
            <div class="control-item">
                <label for="categoryFilter">Category</label>
                <select id="categoryFilter" class="select-filter" onchange="renderShowroomView()">
                    <option value="ALL">All Departments</option>
                    <option value="Sneakers">Sneakers & Footwear</option>
                    <option value="Men">Men's Fashion</option>
                    <option value="Women">Women's Fashion</option>
                    <option value="Beauty">Beauty & Grooming</option>
                    <option value="Wellness">Health & Wellness</option>
                    <option value="Watches">Watches & Luxury</option>
                    <option value="Tech">Tech & Audio</option>
                    <option value="Limited">Limited Editions</option>
                </select>
            </div>
            <div class="control-item">
                <label for="sortFilter">Sort By</label>
                <select id="sortFilter" class="select-filter" onchange="renderShowroomView()">
                    <option value="DEFAULT">Featured Picks</option>
                    <option value="LOW_TO_HIGH">Price: Low to High</option>
                    <option value="HIGH_TO_LOW">Price: High to Low</option>
                </select>
            </div>
        </div>

        <div class="grid" id="productGrid"></div>
    </main>

    <!-- Side-Drawer Details Panel -->
    <div class="sidebar-backdrop" id="sidebarBackdrop" onclick="closeProductSidebar(event)">
        <div class="product-sidebar" onclick="event.stopPropagation()">
            <div class="mobile-drag-handle"></div>
            <div class="sidebar-header">
                <span id="sidebarHeaderTag">Exclusive Archive</span>
                <button class="close-sidebar-btn" onclick="closeProductSidebar()">&times;</button>
            </div>
            <div class="sidebar-img-wrapper" id="sidebarImgContainer"></div>
            <div class="sidebar-body">
                <div class="sidebar-category" id="sidebarCategory"></div>
                <h2 class="sidebar-title" id="sidebarTitle"></h2>
                <div class="sidebar-price" id="sidebarPrice"></div>
                <p class="sidebar-desc" id="sidebarDesc"></p>
                <a href="#" target="_blank" rel="noopener noreferrer" id="sidebarBuyBtn" class="sidebar-buy-btn">Order / Inquire</a>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer>
        <div class="container">
            <p class="rights-statement">&copy; 2026 ARCHIVE SHOWCASE. All Rights Reserved.</p>
            <div class="footer-links">
                <a href="https://www.instagram.com/jordan_store.___/" target="_blank" rel="noopener noreferrer" class="pill-btn">Instagram: @jordan_store.___</a>
                <a href="mailto:rj7010323@gmail.com" class="pill-btn">rj7010323@gmail.com</a>
            </div>
        </div>
    </footer>

    <!-- Word Shuffle Animation -->
    <script>
        const words = ["ARCHIVE", "STORE", "VAULT", "COLLECTION"];
        let wordIndex = 0;
        const brandWordElement = document.getElementById("brandWord");

        setInterval(() => {
            brandWordElement.classList.add("flip-out");
            setTimeout(() => {
                wordIndex = (wordIndex + 1) % words.length;
                brandWordElement.innerText = words[wordIndex];
                brandWordElement.classList.remove("flip-out");
                brandWordElement.classList.add("flip-in");
                setTimeout(() => {
                    brandWordElement.classList.remove("flip-in");
                }, 50);
            }, 350);
        }, 3000);
    </script>

    <!-- Firebase Real-Time SDK Integration -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDggq2H6VpwteslozxGeYEy4ocyS8d_tAo",
            authDomain: "jordan-store-1.firebaseapp.com",
            projectId: "jordan-store-1",
            storageBucket: "jordan-store-1.firebasestorage.app",
            messagingSenderId: "830846757501",
            appId: "1:830846757501:web:7fd37fcb86ef9e30d31f14",
            measurementId: "G-5NK1N5GX8J"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        let cloudProducts = [];

        const q = query(collection(db, "products"), orderBy("createdAt", "desc"));
        onSnapshot(q, (snapshot) => {
            cloudProducts = [];
            snapshot.forEach(docSnap => {
                cloudProducts.push({ id: docSnap.id, ...docSnap.data() });
            });
            renderFeaturedSlidebar();
            renderShowroomView();
        });

        function renderFeaturedSlidebar() {
            const sliderSection = document.getElementById('featuredSliderSection');
            const slider = document.getElementById('featuredSlider');
            slider.innerHTML = '';

            const latestFive = cloudProducts.slice(0, 5);

            if (latestFive.length === 0) {
                sliderSection.style.display = 'none';
                return;
            }

            sliderSection.style.display = 'block';

            latestFive.forEach(product => {
                const item = document.createElement('div');
                item.className = 'slide-item';
                item.onclick = () => openProductSidebar(product.id);

                let imgHtml = `<div class="img-placeholder">ARCHIVE</div>`;
                if (product.img && product.img.trim() !== "") {
                    imgHtml = `<img src="${product.img}" alt="${product.title}">`;
                }

                item.innerHTML = `
                    <div class="slide-img-box">
                        ${imgHtml}
                    </div>
                    <div class="slide-info">
                        <div class="slide-title">${product.title || 'Exclusive Item'}</div>
                        <div class="slide-price">₹${Number(product.price || 0).toLocaleString('en-IN')}</div>
                    </div>
                `;
                slider.appendChild(item);
            });
        }

        window.scrollSlider = function(offset) {
            const slider = document.getElementById('featuredSlider');
            slider.scrollBy({ left: offset, behavior: 'smooth' });
        };

        window.renderShowroomView = function() {
            const displayGrid = document.getElementById('productGrid');
            const categoryValue = document.getElementById('categoryFilter').value;
            const sortValue = document.getElementById('sortFilter').value;
            const searchTerm = (document.getElementById('searchInput').value || '').toLowerCase().trim();

            displayGrid.innerHTML = '';

            let filtered = cloudProducts.filter(item => {
                const matchCategory = (categoryValue === 'ALL') || (item.category || '').toLowerCase() === categoryValue.toLowerCase();
                const matchSearch = !searchTerm || (item.title || '').toLowerCase().includes(searchTerm) || (item.desc || '').toLowerCase().includes(searchTerm);
                return matchCategory && matchSearch;
            });

            if (sortValue === 'LOW_TO_HIGH') {
                filtered.sort((a, b) => Number(a.price || 0) - Number(b.price || 0));
            } else if (sortValue === 'HIGH_TO_LOW') {
                filtered.sort((a, b) => Number(b.price || 0) - Number(a.price || 0));
            }

            if (filtered.length === 0) {
                displayGrid.innerHTML = `
                    <div class="empty-state">
                        <h3 style="font-size:18px; color:#fff; margin-bottom:8px;">No Items Found</h3>
                        <p style="font-size:14px;">Try selecting another category or refining your search term.</p>
                    </div>`;
                return;
            }

            filtered.forEach(product => {
                const card = document.createElement('div');
                card.className = 'card';
                card.onclick = () => openProductSidebar(product.id);

                let imageHtml = `<div class="img-placeholder">ARCHIVE</div>`;
                if (product.img && product.img.trim() !== "") {
                    imageHtml = `<img src="${product.img}" alt="${product.title}">`;
                }

                card.innerHTML = `
                    <div class="card-badge">${product.category || 'Curated'}</div>
                    <div class="img-wrapper">${imageHtml}</div>
                    <div class="info">
                        <h3>${product.title || 'Untitled Item'}</h3>
                        <div class="price">₹${Number(product.price || 0).toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}</div>
                        <div class="click-hint">View Archive Details <span>&rarr;</span></div>
                    </div>
                `;
                displayGrid.appendChild(card);
            });
        };

        window.openProductSidebar = function(productId) {
            const product = cloudProducts.find(p => p.id === productId);
            if (!product) return;

            const backdrop = document.getElementById('sidebarBackdrop');
            const imgWrapper = document.getElementById('sidebarImgContainer');
            
            document.getElementById('sidebarHeaderTag').innerText = product.category ? `${product.category} Showcase` : 'Vault Exclusive';
            document.getElementById('sidebarCategory').innerText = product.category || 'Exclusive Department';
            document.getElementById('sidebarTitle').innerText = product.title || 'Untitled Collection Item';
            document.getElementById('sidebarPrice').innerText = `₹${Number(product.price || 0).toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;
            document.getElementById('sidebarDesc').innerText = product.desc || 'Premium verified archival product. Inquire directly for provenance, sizing details, and instant order facilitation.';
            
            const buyLink = document.getElementById('sidebarBuyBtn');
            buyLink.href = product.link ? encodeURI(product.link) : `mailto:rj7010323@gmail.com?subject=Inquiry:%20${encodeURIComponent(product.title || 'Vault Item')}`;

            if (product.img && product.img.trim() !== "") {
                imgWrapper.innerHTML = `<img src="${product.img}" alt="${product.title}">`;
            } else {
                imgWrapper.innerHTML = `<div class="img-placeholder" style="font-size:32px;">VAULT</div>`;
            }

            backdrop.classList.add('open');
            document.body.style.overflow = 'hidden';
        };

        window.closeProductSidebar = function(event) {
            if (event && event.target !== event.currentTarget && !event.target.classList.contains('close-sidebar-btn')) {
                return;
            }
            const backdrop = document.getElementById('sidebarBackdrop');
            backdrop.classList.remove('open');
            document.body.style.overflow = 'auto';
        };
    </script>
</body>
</html>
